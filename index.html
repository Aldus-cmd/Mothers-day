<!DOCTYPE html>

<html lang="en">
<head>
    <title>To the greatest Mom</title>
    <link rel="stylesheet" href="style.css" />
    <script src="./script.js" defer></script>
    <script src="https://kit.fontawesome.com/a1b7f33862.js" crossorigin="anonymous"></script>
</head>
<body>
    <body>
    <!-- Previous Button -->
    <button id="prev-btn">
        <i class="fas fa-arrow-circle-left"></i>
    </button>


    <!-- Book -->
    <div id="book" class="book">
        <!-- Paper 1 -->
        <div id="p1" class="paper">
            <div class="front">
                <div id="f1" class="front-content">
                    <h1>To The Greatest Mom</h1>                   
                </div>
            </div>
            <div class="back">
                <div id="b1" class="back-content">
                    <img src="Page 1.png" alt="Page 1">
                </div>
            </div>
        </div>
        <!-- Paper 2 -->
        <div id="p2" class="paper">
            <div class="front">
                <div id="f2" class="front-content">
                    <img src="Page 2.png" alt="Page 2">
                </div>
            </div>
            <div class="back">
                <div id="b2" class="back-content">
                    <img src="Page 3.png" alt="Page 3">
                </div>
            </div>
        </div>
        <!-- Paper 3 -->
        <div id="p3" class="paper">
            <div class="front">
                <div id="f3" class="front-content">
                    <img src="Page 4.png" alt="Page 4">
                </div>
            </div>
            <div class="back">
                <div id="b3" class="back-content">
                    <img src="Page 5.png" alt="Page 5">
                </div>
            </div>
        </div>
    </div>

    <!-- Next Button -->
    <button id="next-btn">
        <i class="fas fa-arrow-circle-right"></i>
    </button>

</body>
</html>
